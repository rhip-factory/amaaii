# nginx site for amaaii, installed by the server owner (root).
# Replace amaaii.example.com with the real hostname, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d amaaii.example.com
#
# EVERYTHING goes to 8002 — one Express process serves both the API and the
# PWA. Do not split paths between two upstreams.
server {
    listen 80;
    listen [::]:80;
    server_name amaaii.example.com;

    # Requests are small JSON; Express itself caps bodies at 100 KB.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # Twilio webhook signatures are computed over the public URL, which
        # the app rebuilds from these two headers. Without them every
        # WhatsApp message is rejected with 403 in production.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # The app echoes/mints X-Request-Id; pass nginx's id through so the
        # nginx access log and the app log can be joined on one value.
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;   # AI replies can take several seconds
    }
}
