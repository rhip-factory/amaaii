# nginx site for amaaii: /etc/nginx/sites-available/amaaii.com on red-bridge,
# symlinked into sites-enabled. Install (root):
#   sudo install -m 644 nginx-amaaii.conf /etc/nginx/sites-available/amaaii.com
#   sudo ln -s /etc/nginx/sites-available/amaaii.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d amaaii.com -d www.amaaii.com
# certbot then edits the INSTALLED copy (adds `listen 443 ssl`, the cert
# paths, and an http->https redirect), so the live file = this file + those
# certbot-managed lines. Re-run certbot after reinstalling this file.
#
# EVERYTHING goes to 8002 — one Express process serves both the API and the
# PWA. Do not split paths between two upstreams.
server {
    listen 80;
    listen [::]:80;
    server_name amaaii.com www.amaaii.com;

    # One canonical origin: the PWA's service worker, IndexedDB outbox and
    # saved login are all per-origin, so a mother who used www and apex
    # interchangeably would see two separate, half-synced apps.
    if ($host = www.amaaii.com) {
        return 301 $scheme://amaaii.com$request_uri;
    }

    # Requests are small JSON; Express itself caps bodies at 100 KB.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # Twilio webhook signatures are computed over the public URL, which
        # the app rebuilds from these two headers. Without them every
        # WhatsApp message is rejected with 403 in production.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # The app echoes/mints X-Request-Id; pass nginx's id through so the
        # nginx access log and the app log can be joined on one value.
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;   # AI replies can take several seconds
    }
}
